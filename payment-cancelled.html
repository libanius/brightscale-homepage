<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Not Completed | BrightScale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <style>
    :root{--bg:#f7f8f9;--card:#fff;--text:#1f2328;--muted:#60656f;--dark:#061c0e;--border:#e7e9ee;--shadow:0 16px 45px rgba(0,0,0,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:34px 28px;box-shadow:var(--shadow);text-align:center}.logo{width:min(245px,70%);height:auto;margin:0 auto 24px;display:block}
    h1{font-size:clamp(1.65rem,5vw,2.35rem);line-height:1.15;margin:0 0 12px} p{margin:0 auto;color:var(--muted);line-height:1.7;max-width:500px;font-size:1rem}.btn{display:inline-block;margin-top:24px;background:var(--dark);color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px}.small{margin-top:18px;font-size:.82rem;color:#7a8089}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/brightscale-logo.svg" alt="BrightScale" />
    <h1>Payment was not completed</h1>
    <p>No technical visit was booked and no appointment was confirmed. You can return to WhatsApp whenever you are ready and continue from where you left off.</p>
    <a class="btn" href="https://www.brightscalegroup.com/">Back to BrightScale</a>
    <div class="small">You can also close this page and return to WhatsApp.</div>
  </main>
</body>
</html>
